name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit or tag to validate
        required: false
        type: string

permissions:
  contents: read

jobs:
  game:
    name: Godot import and gameplay regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check CI tooling
        run: python -m unittest discover -s tests -p 'test_ci_*.py' -v
      - name: Install checksum-verified Godot editor
        shell: bash
        run: python tools/ci/install_godot.py --version "$(cat .github/godot-version)" --destination .ci/godot
      - name: Run gameplay and lifecycle checks
        run: python tools/ci/run_checks.py --godot .ci/godot/godot
      - name: Preserve test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: godot-test-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: dev_shots/ci/*.log
          if-no-files-found: ignore
          retention-days: 14

  relay:
    name: Relay tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          check-latest: true
          cache-dependency-path: server/go.sum
      - run: go vet ./...
      - name: Native tests
        run: go test -count=1 ./...
      - name: Race detector
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...
